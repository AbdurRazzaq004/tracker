services:
  - type: web
    name: wealthtracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        value: mongodb+srv://growmoree001_db_user:growmoree001@moneymanagement.emnpjop.mongodb.net/moneymanagement?retryWrites=true&w=majority
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    healthCheckPath: /
